name: CI/CD AItonomo Pro

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:  # permite lanzarlo manualmente desde GitHub

env:
  PROJECT_ID: proyectodataia3
  REGION: europe-southwest1
  REGISTRY: europe-southwest1-docker.pkg.dev/proyectodataia3/repo-aitonomo

jobs:
  ci:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build ./backend -f backend/Dockerfile

      - name: Build frontend
        run: docker build ./static -f static/Dockerfile

      - name: Build dashboard
        run: docker build ./dashboard-buss -f dashboard-buss/Dockerfile

  cd:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push backend
        run: |
          docker build -t $REGISTRY/backend:$GITHUB_SHA ./backend
          docker push $REGISTRY/backend:$GITHUB_SHA

      - name: Build & Push frontend
        run: |
          docker build -t $REGISTRY/frontend:$GITHUB_SHA ./static
          docker push $REGISTRY/frontend:$GITHUB_SHA

      - name: Build & Push dashboard
        run: |
          docker build -t $REGISTRY/dashboard:$GITHUB_SHA ./dashboard-buss
          docker push $REGISTRY/dashboard:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy api-backend \
            --image $REGISTRY/backend:$GITHUB_SHA \
            --region $REGION --project $PROJECT_ID --quiet

          gcloud run deploy web-frontend \
            --image $REGISTRY/frontend:$GITHUB_SHA \
            --region $REGION --project $PROJECT_ID --quiet

          gcloud run deploy investor-dashboard \
            --image $REGISTRY/dashboard:$GITHUB_SHA \
            --region $REGION --project $PROJECT_ID --quiet
